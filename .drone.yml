---
kind: pipeline
type: exec
name: release
steps:
  - name: docker-build
    commands:
      - npm install
      - npx nx build sikuzangu-org --skip-nx-cache
      - docker build -t sikuzangu-org:${DRONE_TAG} -f ./sikuzangu-org-Dockerfile .
  - name: docker-run
    environment:
      S_DATABASE_HOST:
        from_secret: _S_DATABASE_HOST
      S_DATABASE_USER:
        from_secret: _S_DATABASE_USER
      S_DATABASE_PASSWORD:
        from_secret: _S_DATABASE_PASSWORD
      S_DATABASE_NAME:
        from_secret: _S_DATABASE_NAME
      ATLASGO_VAR_DATABASE:
        from_secret: _ATLASGO_VAR_DATABASE
      ATLASGO_URL:
        from_secret: _ATLASGO_URL
      S_BREVO_API_KEY:
        from_secret: _S_BREVO_API_KEY
    depends_on:
      - docker-build
    commands:
      - docker stop sikuzangu-org || true && docker rm sikuzangu-org || true
      - >-
        docker 
        run 
        --detach
        --name=sikuzangu-org 
        --publish=40001:3000                           
        --network=petascale.systems 
        --env=S_DATABASE_HOST=$S_DATABASE_HOST 
        --env=S_DATABASE_USER=$S_DATABASE_USER 
        --env=S_DATABASE_PASSWORD=$S_DATABASE_PASSWORD 
        --env=S_DATABASE_NAME=$S_DATABASE_NAME 
        --env=ATLASGO_VAR_DATABASE=$ATLASGO_VAR_DATABASE 
        --env=ATLASGO_URL=$ATLASGO_URL 
        --env=S_BREVO_API_KEY=$S_BREVO_API_KEY 
        sikuzangu-org:${DRONE_TAG}
trigger:
  event:
    - tag
